name: dstoolkit_app
description: DsToolKit 移动端 — 随身查看你的 DeepSeek 对话
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 状态管理
  flutter_riverpod: ^2.6.1
  # 路由
  go_router: ^14.6.2
  # 网络
  dio: ^5.7.0
  # Token 安全存储
  flutter_secure_storage: ^9.2.2
  # 离线缓存（SQLite）
  sqflite: ^2.4.1
  path: ^1.9.0
  # Markdown 渲染
  flutter_markdown: ^0.7.4+3
  markdown: ^7.2.2
  # 跳转 Web（付费/注册）
  url_launcher: ^6.3.1
  # 统计图表
  fl_chart: ^0.69.2
  # 工具
  intl: ^0.19.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
